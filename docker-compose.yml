services:
  tebak-gambar:
    # Ganti USERNAME_GITHUB/NAMA_REPO sesuai repository GitHub Anda saat di VPS
    image: ghcr.io/syamban14/tebak-gambar:latest
    build: .
    container_name: tebak-gambar-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
